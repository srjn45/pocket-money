services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: pocket_money_db
    ports:
      - "5432:5432" # exposed so the CI seed (host go-run) can reach it
    environment:
      POSTGRES_USER: pocket
      POSTGRES_PASSWORD: pocket
      POSTGRES_DB: pocket_money
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket -d pocket_money"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-image app: serves the web SPA + API from one Go binary.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocket_money_app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pocket:pocket@postgres:5432/pocket_money?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (e.g. export JWT_SECRET=$(openssl rand -hex 32))}
      # PORT defaults to 8080. CORS_ORIGINS unneeded (web app is same-origin).
      # APP_BASE_URL unset → invite links default to the request host.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
