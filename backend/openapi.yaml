openapi: 3.0.3
info:
  title: Pocket Money API
  description: Backend API for managing chores, ledger entries, and balances in family groups
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.pocket-money.example.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and user management
  - name: Groups
    description: Group management and membership
  - name: Chores
    description: Chore management
  - name: Ledger
    description: Ledger entries and balance tracking
  - name: Allowances
    description: Recurring monthly pocket money configuration and history
  - name: Loans
    description: Loan requests, approval, and EMI repayment

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API
      operationId: health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: >
        Creates a new user account and returns a JWT plus the user, so the client is
        logged in immediately (auto-login). Same response shape as login; no separate
        login call is needed after registering.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and logged in (returns token + user, same as login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request (validation error or email already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticates a user and returns a JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Returns the currently authenticated user's information
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/password:
    put:
      tags:
        - Auth
      summary: Change password (logged-in)
      description: >
        Changes the authenticated user's password. Verifies the current password
        (bcrypt) before setting the new one. No email/reset flow. Does NOT rotate
        the JWT — existing tokens remain valid until expiry (LAN v2 limitation).
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed successfully (no content)
        '400':
          description: Malformed body or new password too short (min 6)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated (missing/invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups:
    get:
      tags:
        - Groups
      summary: List user's groups
      description: Returns all groups the authenticated user is a member of
      operationId: listGroups
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of the user's groups, each enriched with role, member count, and a
            role-dependent summary balance for the dashboard.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSummaryResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Groups
      summary: Create a new group
      description: Creates a new group with the authenticated user as admin
      operationId: createGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}:
    get:
      tags:
        - Groups
      summary: Get group details
      description: Returns detailed information about a group including members and chores count
      operationId: getGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetailResponse'
        '400':
          description: Invalid group ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Groups
      summary: Update group config
      description: Updates the member_chore_submission_enabled flag (D2). Admin only.
      operationId: updateGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only group admin can update the group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/members:
    get:
      tags:
        - Groups
      summary: List group members
      description: Returns all members of a group
      operationId: listMembers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
        '400':
          description: Invalid group ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Groups
      summary: Add a member by email (add-by-email lifecycle)
      description: >
        Admin-only. Resolves the email to a user and attaches them to the group as
        a `member`: an unknown email creates a new SHADOW user (no password, cannot
        log in) with the given name; an existing registered user is attached and
        notified (N-1 `added_to_group`); an existing shadow is attached with no
        notification. Adding the same email to the same group again is a `409`
        (exactly one membership, at most one N-1 from the first successful add).
      operationId: addMemberByEmail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          description: Invalid group ID or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the group admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The target email is already a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/members/{userId}:
    delete:
      tags:
        - Groups
      summary: Remove a member (admin) or leave a group (self)
      description: >
        Removes a membership. The admin may remove any non-admin member; any member
        may remove themselves (leave). Allowed ONLY when the target member's balance
        is settled to exactly 0 AND they have no loan in `requested` or `active`
        status. Ledger history and closed/rejected loans are KEPT (they reference the
        user, not the membership); the member's allowance config rows are deleted and
        any pending ledger entries are auto-rejected. The group admin can neither leave
        nor be removed. Triggers due allowance/EMI posting before evaluating the
        balance so a stale un-posted entry cannot let a non-zero member out.
      operationId: removeMember
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          description: ID of the member to remove (equal to the caller for "leave")
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed / left successfully (no content)
        '400':
          description: Invalid group ID or user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A non-admin member may only remove themselves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Target user is not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Removal blocked — the target is the group admin, or their balance is not
            zero, or they have an active/pending loan. The error message is
            human-readable and states which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/invite:
    post:
      tags:
        - Groups
      summary: Create group invite
      description: Creates an invite token for joining the group (admin only)
      operationId: createInvite
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invite created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '400':
          description: Invalid group ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only group admin can create invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/join:
    post:
      tags:
        - Groups
      summary: Join group
      description: Joins a group using an invite token
      operationId: joinGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '200':
          description: Successfully joined group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Invalid token, token expired, or already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/chores:
    get:
      tags:
        - Chores
      summary: List chores
      description: Returns all chores for a group
      operationId: listChores
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of chores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChoreResponse'
        '400':
          description: Invalid group ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Chores
      summary: Create chore
      description: Creates a new chore for the group (admin only)
      operationId: createChore
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChoreRequest'
      responses:
        '201':
          description: Chore created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoreResponse'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only group admin can create chores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chores/{id}:
    patch:
      tags:
        - Chores
      summary: Update chore
      description: Updates a chore (admin only)
      operationId: updateChore
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Chore ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChoreRequest'
      responses:
        '200':
          description: Chore updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoreResponse'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only group admin can update chores or cannot modify system chore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chore not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Chores
      summary: Delete chore
      description: Soft deletes a chore (admin only)
      operationId: deleteChore
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Chore ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Chore deleted successfully
        '400':
          description: Invalid chore ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only group admin can delete chores or cannot delete system chore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chore not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/ledger:
    get:
      tags:
        - Ledger
      summary: List ledger entries
      description: >-
        Returns ledger entries for a group. Members see only their own entries;
        admin sees all. A member supplying `user_id` for another member gets 403
        (D6) — they may only scope to themselves.
      operationId: listLedger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
            enum: [approved, pending_approval, rejected]
        - name: user_id
          in: query
          required: false
          description: Filter by user ID (admin only)
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          description: Filter by entry type
          schema:
            type: string
            enum: [chore, allowance, emi, settlement, adjustment]
        - name: period
          in: query
          required: false
          description: Filter by period (YYYY-MM format)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: List of ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group, or a member requesting another member's data (D6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Ledger
      summary: Create ledger entry
      description: Creates a new ledger entry. Members create pending entries for themselves, admin can create approved entries for any member. The member self-submit branch (non-admin, entry_type=chore) requires the group's member_chore_submission_enabled flag (D2) to be ON; it returns 403 when the flag is OFF.
      operationId: createLedger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerRequest'
      responses:
        '201':
          description: Ledger entry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied (e.g., only admin can create settlement entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ledger/{id}:
    put:
      tags:
        - Ledger
      summary: Edit a manual ledger entry
      description: >-
        Edits a manual entry (chore, adjustment, settlement). Admin only (D6).
        System entries (allowance, emi) are rejected with 403. Writes an
        entry_audit row capturing prior values.
      operationId: editLedger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ledger entry ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditLedgerRequest'
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
        '400':
          description: Validation error (bad amount/currency/direction)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not admin, or entry is system-generated (not editable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Ledger
      summary: Delete a manual ledger entry
      description: >-
        Hard-deletes a manual entry (chore, adjustment, settlement). Admin only
        (D6). System entries (allowance, emi) are rejected with 403. Writes an
        entry_audit row.
      operationId: deleteLedger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ledger entry ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not admin, or entry is system-generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ledger/{id}/approve:
    post:
      tags:
        - Ledger
      summary: Approve ledger entry
      description: Approves a pending ledger entry (admin only). Requires the group's member_chore_submission_enabled flag (D2) to be ON; returns 403 when the flag is OFF.
      operationId: approveLedger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ledger entry ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entry approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
        '400':
          description: Entry is not pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only group admin can approve entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ledger/{id}/reject:
    post:
      tags:
        - Ledger
      summary: Reject ledger entry
      description: Rejects a pending ledger entry (admin only). Requires the group's member_chore_submission_enabled flag (D2) to be ON; returns 403 when the flag is OFF.
      operationId: rejectLedger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ledger entry ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entry rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
        '400':
          description: Entry is not pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only group admin can reject entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/balance:
    get:
      tags:
        - Ledger
      summary: Get group balances
      description: >-
        Admin sees every member's balance; a member sees only their own balance
        row (D6).
      operationId: getBalance
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of member balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceResponse'
        '400':
          description: Invalid group ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/statement:
    get:
      tags:
        - Ledger
      summary: Monthly statement for a group
      description: >-
        Derived monthly statement (§3.9). Triggers due allowance/EMI posting,
        then returns per-member figures for the requested month: opening, base,
        chores, adjustments, emi, total_due, cleared (payments), closing — every
        amount in the group's currency (D7). Admin sees one row per non-admin
        member plus a group total; a member sees only their own row and no group
        total (D6). Members whose join month is after the requested month are
        omitted. Invariant: a month's closing_balance equals the next month's
        opening_balance.
      operationId: getStatement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Group ID (UUID)
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          required: false
          description: Month (YYYY-MM). Defaults to the current server-local month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: user_id
          in: query
          required: false
          description: >-
            Admin only — narrow to one member (group_total then omitted). A member
            may pass only their own id; any other id is 403 (D6).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The monthly statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementResponse'
        '400':
          description: Invalid group ID / period / user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member, or member requesting another member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/allowances:
    get:
      tags:
        - Allowances
      summary: List allowance rows for a group
      description: >
        Admin sees all members' allowance history; member sees only their own.
        Returns full history rows (all effective_from values per member).
      operationId: listAllowances
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group ID
      responses:
        '200':
          description: Allowance rows (empty array when none configured)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllowanceResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/allowances/{userId}:
    put:
      tags:
        - Allowances
      summary: Set or change a member's monthly pocket money
      description: >
        Admin only. Sets or changes a member's monthly pocket money.
        A new effective_from creates a new history row (past months not rewritten).
        Amount 0 pauses the allowance. Setting the same effective_from twice
        updates the amount (correction) — idempotent, still 200.
      operationId: setAllowance
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group ID
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Target member's user ID (must be a member, not the admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAllowanceRequest'
      responses:
        '200':
          description: Allowance set or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceResponse'
        '400':
          description: Validation error (negative amount, invalid period, targeting admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the group admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Target user is not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/groups/{id}/loans:
    get:
      tags:
        - Loans
      summary: List loans for a group
      description: >-
        Admin sees all loans; member sees only their own. A member supplying
        `user_id` for another member gets 403 (D6) — they may only scope to
        themselves.
      operationId: listLoans
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group ID
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
          description: Filter by borrower user ID (admin only)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [requested, active, rejected, closed]
            nullable: true
          description: Filter by loan status
      responses:
        '200':
          description: Loan list (empty array when none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid filter parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group, or a member requesting another member's data (D6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Loans
      summary: Create a loan or loan request
      description: >
        Member creates a `requested` loan for themselves;
        admin creates a pre-approved `active` loan for a member.
        Disbursement is not a ledger entry; repayment is via monthly EMI debits.
      operationId: createLoan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoanRequest'
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Target user not a member (admin-created loans)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/loans/{id}/approve:
    post:
      tags:
        - Loans
      summary: Approve a loan request
      description: >
        Admin only. Transitions `requested` → `active`; may override principal/installments;
        sets start_period to next calendar month.
      operationId: approveLoan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Loan ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveLoanRequest'
      responses:
        '200':
          description: Loan approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the group admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Loan is not pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/loans/{id}/reject:
    post:
      tags:
        - Loans
      summary: Reject a loan request
      description: Admin only. Transitions `requested` → `rejected`.
      operationId: rejectLoan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Loan ID
      responses:
        '200':
          description: Loan rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the group admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Loan is not pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/loans/{id}/close:
    post:
      tags:
        - Loans
      summary: Early payoff — close an active loan
      description: >
        Admin only. Posts one final EMI debit for the outstanding amount
        (principal − Σ posted EMIs) and sets status to `closed`.
      operationId: closeLoan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Loan ID
      responses:
        '200':
          description: Loan closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the group admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Loan is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          minLength: 6
          description: User's password (minimum 6 characters)
        name:
          type: string
          description: User's full name
        dob:
          type: string
          format: date
          nullable: true
          description: Date of birth (YYYY-MM-DD)
        sex:
          type: string
          nullable: true
          description: User's sex
      required:
        - email
        - password
        - name

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          description: The user's current password, verified before the change.
        new_password:
          type: string
          minLength: 6
          description: The new password (minimum 6 characters).
      required:
        - current_password
        - new_password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: User's password
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - token
        - user

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        email:
          type: string
          format: email
          description: User's email address
        name:
          type: string
          description: User's full name
        status:
          type: string
          enum: [shadow, registered]
          description: >
            Account status. A logged-in user is always `registered` (shadow users
            cannot authenticate); exposed for completeness/consistency.
        dob:
          type: string
          format: date-time
          nullable: true
          description: Date of birth
        sex:
          type: string
          nullable: true
          description: User's sex
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
      required:
        - id
        - email
        - name
        - status
        - created_at

    Money:
      type: object
      description: >
        A monetary amount in a group's currency. `value` is in minor units
        (cents/paise; all three supported currencies have exponent 2) and is NEVER a
        float. `currency` always equals the owning group's currency (D7); the server
        rejects any request whose currency differs from the group's.
      properties:
        currency:
          type: string
          enum: [EUR, USD, INR]
          description: ISO-4217 code; always the owning group's currency.
        value:
          type: integer
          format: int64
          description: Amount in minor units (e.g. €12.50 = 1250). Always an integer.
      required:
        - currency
        - value

    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: Group name
        currency:
          type: string
          enum: [EUR, USD, INR]
          description: The group's immutable ISO-4217 currency (D7). Required.
      required:
        - name
        - currency

    GroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Group ID
        name:
          type: string
          description: Group name
        admin_user_id:
          type: string
          format: uuid
          description: ID of the group admin
        currency:
          type: string
          enum: [EUR, USD, INR]
          description: The group's immutable ISO-4217 currency (D7).
        member_chore_submission_enabled:
          type: boolean
          description: D2 flag; when true members may submit chore entries. Default false.
        created_at:
          type: string
          format: date-time
          description: Group creation timestamp
      required:
        - id
        - name
        - admin_user_id
        - currency
        - member_chore_submission_enabled
        - created_at

    GroupSummaryResponse:
      type: object
      description: A group the caller belongs to, enriched for the dashboard listing. The
        summary_balance is a glanceable figure computed from currently-posted approved ledger
        entries; it does NOT trigger allowance/EMI posting, so it may lag the authoritative
        per-group balance by the current month's machine-posted entries until the group is opened.
      properties:
        id:
          type: string
          format: uuid
          description: Group ID
        name:
          type: string
          description: Group name
        admin_user_id:
          type: string
          format: uuid
          description: ID of the group admin
        currency:
          type: string
          enum: [EUR, USD, INR]
          description: The group's immutable ISO-4217 currency (D7).
        created_at:
          type: string
          format: date-time
          description: Group creation timestamp
        role:
          type: string
          enum: [admin, member]
          description: The caller's role in this group.
        member_count:
          type: integer
          description: Number of members in the group (includes the admin).
        summary_balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            Role-dependent summary in the group's currency. For role=admin, the sum of all NON-admin
            members' balances (= total the admin owes members; typically >= 0). For role=member, the
            caller's OWN balance in this group (positive = earned/owed-to-them, negative = they owe
            the admin). Computed as Σ approved credits − Σ approved debits. A member never receives
            another member's figure.
      required:
        - id
        - name
        - admin_user_id
        - currency
        - created_at
        - role
        - member_count
        - summary_balance

    GroupDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Group ID
        name:
          type: string
          description: Group name
        admin_user_id:
          type: string
          format: uuid
          description: ID of the group admin
        currency:
          type: string
          enum: [EUR, USD, INR]
          description: The group's immutable ISO-4217 currency (D7).
        member_chore_submission_enabled:
          type: boolean
          description: D2 flag; when true members may submit chore entries. Default false.
        created_at:
          type: string
          format: date-time
          description: Group creation timestamp
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberResponse'
          description: List of group members
        chores_count:
          type: integer
          description: Number of chores in the group
      required:
        - id
        - name
        - admin_user_id
        - currency
        - member_chore_submission_enabled
        - created_at
        - members
        - chores_count

    MemberResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: User ID
        name:
          type: string
          description: User's full name
        email:
          type: string
          format: email
          description: User's email address
        role:
          type: string
          enum: [admin, member]
          description: User's role in the group
        status:
          type: string
          enum: [shadow, registered]
          description: >
            Whether this member has registered (can log in) or is a shadow the
            admin bookkeeps against.
        joined_at:
          type: string
          format: date-time
          description: Timestamp when user joined the group
      required:
        - user_id
        - name
        - email
        - role
        - status
        - joined_at

    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            Email of the person to add. Case-insensitive matching is NOT required
            for this WP (the email column is plain TEXT UNIQUE); match is exact.
        name:
          type: string
          description: >
            Display name. Used only when creating a new shadow user; ignored when
            the email already resolves to a user.
      required:
        - email
        - name

    InviteRequest:
      type: object
      properties:
        expires_in_days:
          type: integer
          minimum: 1
          default: 7
          description: Number of days until invite expires

    InviteResponse:
      type: object
      properties:
        invite_url:
          type: string
          description: Full invite URL
        token:
          type: string
          description: Invite token
        expires_at:
          type: string
          format: date-time
          description: Expiration timestamp
      required:
        - invite_url
        - token
        - expires_at

    JoinRequest:
      type: object
      properties:
        token:
          type: string
          description: Invite token
      required:
        - token

    CreateChoreRequest:
      type: object
      properties:
        name:
          type: string
          description: Chore name
        description:
          type: string
          nullable: true
          description: Chore description
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Amount earned for completing the chore. value >= 1; currency must equal the group's.
      required:
        - name
        - amount

    UpdateChoreRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Chore name
        description:
          type: string
          nullable: true
          description: Chore description
        amount:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Amount earned for completing the chore. value >= 1 when present; currency must equal the group's.

    ChoreResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Chore ID
        group_id:
          type: string
          format: uuid
          description: Group ID
        name:
          type: string
          description: Chore name
        description:
          type: string
          nullable: true
          description: Chore description
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Amount earned for completing the chore, in the group's currency.
        is_system:
          type: boolean
          description: Whether this is a system-generated chore (e.g., Settlement)
        created_at:
          type: string
          format: date-time
          description: Chore creation timestamp
      required:
        - id
        - group_id
        - name
        - amount
        - is_system
        - created_at

    CreateLedgerRequest:
      type: object
      properties:
        entry_type:
          type: string
          enum: [chore, settlement, adjustment]
          description: Type of ledger entry. allowance/emi are machine-posted only and are rejected on this endpoint.
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Target user ID (admin may specify any member; member defaults to self)
        chore_id:
          type: string
          format: uuid
          nullable: true
          description: Chore ID (required when entry_type=chore; must be a non-system chore in this group)
        amount:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            Amount in the group's currency (value >= 1), required for settlement/adjustment; ignored for
            chore — chore config amount is used instead. When supplied, currency must equal the group's.
        direction:
          type: string
          enum: [credit, debit]
          nullable: true
          description: Direction (required for adjustment; server sets direction for chore and settlement)
        note:
          type: string
          nullable: true
          description: Optional note (recommended for adjustment to explain the reason)
      required:
        - entry_type

    EditLedgerRequest:
      type: object
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: New amount in the group's currency (value >= 1). Currency must equal the group's.
        direction:
          type: string
          enum: [credit, debit]
          nullable: true
          description: Required for adjustment entries; must be omitted for chore/settlement (server keeps their fixed direction).
        note:
          type: string
          nullable: true
          description: Replaces the entry note; null or omitted clears it.
      required:
        - amount

    UpdateGroupRequest:
      type: object
      properties:
        member_chore_submission_enabled:
          type: boolean
          description: D2 flag — when true, members may submit chore entries for admin approval.
      required:
        - member_chore_submission_enabled

    LedgerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Ledger entry ID
        group_id:
          type: string
          format: uuid
          description: Group ID
        user_id:
          type: string
          format: uuid
          description: User whose balance is affected
        chore_id:
          type: string
          format: uuid
          nullable: true
          description: Chore ID (null for settlement/adjustment/allowance/emi)
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Amount in the group's currency. value is always positive — the direction field indicates credit/debit.
        status:
          type: string
          enum: [approved, pending_approval, rejected]
          description: Entry status
        entry_type:
          type: string
          enum: [chore, allowance, emi, settlement, adjustment]
          description: Type of balance event
        direction:
          type: string
          enum: [credit, debit]
          description: Credit adds to balance; debit subtracts from balance
        loan_id:
          type: string
          format: uuid
          nullable: true
          description: Loan ID (set on emi entries; FK added in migration 011)
        period:
          type: string
          nullable: true
          description: Month period in YYYY-MM format (set on allowance/emi entries)
        note:
          type: string
          nullable: true
          description: Optional free-text note
        created_by_user_id:
          type: string
          format: uuid
          description: User who created the entry
        decided_by:
          type: string
          format: uuid
          nullable: true
          description: User who approved or rejected the entry
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: When the entry was approved or rejected
        created_at:
          type: string
          format: date-time
          description: Entry creation timestamp
      required:
        - id
        - group_id
        - user_id
        - amount
        - status
        - entry_type
        - direction
        - created_by_user_id
        - created_at

    BalanceResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: User ID
        name:
          type: string
          description: User's full name
        balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Sum of approved credits minus approved debits, in the group's currency.
      required:
        - user_id
        - name
        - balance

    StatementTotals:
      type: object
      description: >-
        Element-wise sum of the eight statement figures over the returned members
        (the pocket-money recipients). Present only on the unfiltered admin view.
      properties:
        opening_balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. Carried-forward balance at the start of the month (Σ signed over prior months).
        base:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of allowance credits in the month.
        chores:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of chore credits in the month.
        adjustments:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. Sum of signed adjustment entries in the month (may be negative).
        emi:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of EMI debit magnitudes in the month.
        total_due:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. opening_balance + base + chores + adjustments − emi.
        cleared:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of settlement (payment) debit magnitudes in the month.
        closing_balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. total_due − cleared. Equals next month's opening_balance.
      required:
        - opening_balance
        - base
        - chores
        - adjustments
        - emi
        - total_due
        - cleared
        - closing_balance

    MemberStatementResponse:
      type: object
      description: One member's derived figures for the requested month, plus that month's passbook.
      properties:
        user_id:
          type: string
          format: uuid
          description: Member's user ID.
        name:
          type: string
          description: Member's full name.
        opening_balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. Carried-forward balance at the start of the month (Σ signed over prior months). Positive = owed to the member.
        base:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of allowance credits in the month.
        chores:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of chore credits in the month.
        adjustments:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. Sum of signed adjustment entries in the month (may be negative).
        emi:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of EMI debit magnitudes in the month.
        total_due:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. opening_balance + base + chores + adjustments − emi.
        cleared:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Non-negative. Sum of settlement (payment) debit magnitudes in the month.
        closing_balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed. total_due − cleared. Equals next month's opening_balance (the core invariant).
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerResponse'
          description: The member's approved ledger rows for this month (effMonth == period), ordered created_at ASC.
      required:
        - user_id
        - name
        - opening_balance
        - base
        - chores
        - adjustments
        - emi
        - total_due
        - cleared
        - closing_balance

    StatementResponse:
      type: object
      description: >-
        Monthly statement for a group (§3.9). Admin callers see one row per
        non-admin member plus group_total; member callers see only their own row
        and no group_total (D6).
      properties:
        group_id:
          type: string
          format: uuid
          description: Group ID.
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: The month (YYYY-MM) this statement covers.
        currency:
          type: string
          enum: [EUR, USD, INR]
          description: The group's currency (D7); stamped on every Money in this response.
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberStatementResponse'
          description: One row per included member. Empty when the caller's join month is after the period.
        group_total:
          allOf:
            - $ref: '#/components/schemas/StatementTotals'
          nullable: true
          description: Element-wise sum over members. Present only on the unfiltered admin view; omitted/null for member callers and narrowed admin views.
      required:
        - group_id
        - period
        - currency
        - members

    SetAllowanceRequest:
      type: object
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Monthly pocket money in the group's currency. value >= 0 (0 pauses the allowance); currency must equal the group's.
        effective_from:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: Month this amount takes effect (YYYY-MM). Defaults to the current month.
      required:
        - amount

    AllowanceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Monthly pocket money in the group's currency; value 0 = paused.
        effective_from:
          type: string
          description: 'YYYY-MM'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      required:
        - id
        - group_id
        - user_id
        - amount
        - effective_from
        - created_by
        - created_at

    CreateLoanRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Borrower. Required when the admin creates a pre-approved loan; ignored/self for member requests.
        principal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Loan principal in the group's currency. value >= 1; currency must equal the group's.
        installments:
          type: integer
          minimum: 1
          description: Number of monthly installments. > 0.
        note:
          type: string
          nullable: true
      required:
        - principal
        - installments

    ApproveLoanRequest:
      type: object
      properties:
        principal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Optional principal override in the group's currency. value >= 1 when present; currency must equal the group's.
        installments:
          type: integer
          minimum: 1
          nullable: true
      description: Optional overrides applied before approval; emi_amount is recomputed.

    LoanResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        principal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Loan principal in the group's currency.
        installments:
          type: integer
        emi_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: ceil(principal/installments), in the group's currency.
        start_period:
          type: string
          nullable: true
          description: 'YYYY-MM; null until active'
        status:
          type: string
          enum: [requested, active, rejected, closed]
        note:
          type: string
          nullable: true
        requested_at:
          type: string
          format: date-time
        decided_by:
          type: string
          format: uuid
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        installments_posted:
          type: integer
          description: Count of posted EMI entries
        outstanding:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: principal − Σ posted EMIs, in the group's currency.
      required:
        - id
        - group_id
        - user_id
        - principal
        - installments
        - emi_amount
        - status
        - requested_at
        - installments_posted
        - outstanding

