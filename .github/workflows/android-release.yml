name: Submit Android build (EAS, async)

# Submits an Android APK build to EAS (preview profile) and returns immediately
# (--no-wait). A separate scheduled workflow, "Publish finished APK to Release"
# (android-publish.yml), attaches the finished APK to the matching GitHub Release
# (v<appVersion>) so the promo site can link to a stable "latest" URL:
#   https://github.com/srjn45/pocket-money/releases/latest/download/pocket-money.apk
#
# Why async: EAS free-tier builds can sit in a shared queue for HOURS. Blocking a
# runner on `--wait` meant the job hit its timeout and was cancelled before the
# APK could be published (this bit v1.0.2 and v1.0.3). Submitting async keeps this
# job ~2 min and moves publishing to the poll-based android-publish.yml.
#
# Operator setup (one-time):
#   - Secret  EXPO_TOKEN    : an Expo access token (expo.dev → Access tokens).
#   - Variable EAS_API_URL  : the server API base URL baked into the APK, e.g.
#                             https://money.example.com/api/v1
#                             (build-time; the APK talks only to this host).
#
# Trigger: push a version tag (e.g. v1.0.0), or run manually (workflow_dispatch)
# from a tag ref, optionally overriding the API URL.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'EXPO_PUBLIC_API_URL to bake into the APK (overrides the EAS_API_URL repo variable)'
        required: false
        type: string

permissions:
  contents: read   # only submits the build; android-publish.yml owns releases

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Async submit only (npm ci + eas setup + project upload). No queue waiting.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve & bake the API URL
        run: |
          API_URL="${{ github.event.inputs.api_url || vars.EAS_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error::No API URL. Set the EAS_API_URL repo variable or pass api_url on manual run — otherwise the APK would ship pointing at the eas.json placeholder."
            exit 1
          fi
          echo "Baking EXPO_PUBLIC_API_URL=$API_URL into the preview profile"
          # eas.json is edited only in this ephemeral checkout — never committed.
          node -e "const fs=require('fs');const f='eas.json';const j=JSON.parse(fs.readFileSync(f));j.build.preview.env.EXPO_PUBLIC_API_URL=process.env.API_URL;fs.writeFileSync(f,JSON.stringify(j,null,2));" API_URL="$API_URL"
        env:
          API_URL: ${{ github.event.inputs.api_url || vars.EAS_API_URL }}

      - name: Submit EAS build (async, no wait)
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait --json > build.json
          node -e "const a=require('./build.json');const b=Array.isArray(a)?a[0]:a;console.log('Submitted EAS build',b.id||'(unknown id)');"
          echo "Build submitted. 'Publish finished APK to Release' (android-publish.yml) will attach the APK to ${{ github.ref_name }} once it finishes."
