name: CI

on:
  push:
    branches: [main, master, autopilot/integration]
  pull_request:
    branches: [main, master, autopilot/integration]

env:
  GO_VERSION: '1.24'

jobs:
  # ============================================================================
  # LINT JOB
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./backend
          args: --timeout=5m

  # ============================================================================
  # TEST JOB
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pocket_money_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run integration tests
        run: go test -v -race -p 1 -tags=integration ./...
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
          TEST_DB_NAME: pocket_money_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.out

  # ============================================================================
  # BUILD JOB
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o bin/server ./cmd/server
          ls -la bin/

      - name: Build single-image (root Dockerfile)
        working-directory: ${{ github.workspace }}
        run: docker build -t pocket-money:${{ github.sha }} .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: backend/bin/server

  # ============================================================================
  # FRONTEND WEB-EXPORT SMOKE JOB
  # ============================================================================
  fe-web-export:
    name: Frontend Web Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Web export smoke test
        run: npx expo export --platform web

  # ============================================================================
  # COMPOSE SMOKE JOB (V3-6.1)
  # Boots postgres + the SINGLE-IMAGE app via docker compose and runs the
  # existing Playwright e2e suite against the single origin (http://localhost:8080,
  # same-origin API at /api/v1) — proving the packaged artifact, not dev servers.
  # Replaces the old dev-server `e2e` job.
  # ============================================================================
  compose-smoke:
    name: Compose Smoke (single-image e2e)
    runs-on: ubuntu-latest
    needs: [lint, test] # gate the expensive Docker job behind the cheap floors
    env:
      TZ: UTC
      E2E_WEB_BASE: http://localhost:8080
      E2E_API_BASE: http://localhost:8080/api/v1
      E2E_EXTERNAL_SERVER: "1" # single image serves the web; no npx serve

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go # for the host-run seed
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js # for e2e deps + playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Build + boot single image
        env:
          JWT_SECRET: ci-smoke-secret
        run: docker compose up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && echo "app ready" && exit 0
            echo "waiting for app... ($i)"; sleep 3
          done
          echo "app never became healthy" >&2
          docker compose logs app
          exit 1

      - name: Seed demo family (host go-run → exposed postgres)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://pocket:pocket@localhost:5432/pocket_money?sslmode=disable
          JWT_SECRET: ci-smoke-secret
          # APP_BASE_URL intentionally unset → invites use the request host (same origin)
        run: go run ./cmd/seed --reset --out ../e2e/fixtures/seed.summary.json

      - name: Install e2e deps
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e against single image
        working-directory: ./e2e
        run: npx playwright test

      - name: App logs on failure
        if: failure()
        run: docker compose logs app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ============================================================================
  # BACKUP VERIFY JOB (WP-1.4)
  # Proves `make backup` + `make backup-verify` work end-to-end against the
  # real compose Postgres. Closes the acceptance criterion that could not be
  # met on the docker-less dev host. See docs/specs/WP-1.4.md §5.
  # ============================================================================
  backup-verify:
    name: Backup Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Postgres via docker compose
        run: docker compose up -d postgres

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U pocket -d pocket_money; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i)"
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          docker compose logs postgres
          exit 1

      - name: Seed a table with a row
        run: |
          docker compose exec -T postgres psql -U pocket -d pocket_money -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE ci_smoke (id int PRIMARY KEY, note text);" \
            -c "INSERT INTO ci_smoke (id, note) VALUES (1, 'backup-verify');"

      - name: make backup
        run: make backup

      - name: make backup-verify
        run: make backup-verify

      - name: Tear down
        if: always()
        run: docker compose down -v
